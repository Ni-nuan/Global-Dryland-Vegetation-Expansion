name: msavi
index: MSAVI
description: Reusable vegetation-expansion configuration. Scientific logic is implemented
  once in src/01_vegetation_expansion/.
threshold:
  enabled: true
  input_folder: data/local/vegetation/msavi_annual
  output_folder: data/local/vegetation/msavi_threshold_014_8857
  tif_pattern: '*.tif'
  threshold: 0.14
  scale_factor: 1.0
  dst_crs: EPSG:8857
  dst_resolution_m: 500
  nodata_out: 255
  overwrite: false
hex_trend:
  tif_folder: data/local/vegetation/msavi_threshold_014_8857
  tif_pattern: '*_measure.tif'
  mask_vector: data/local/drylands/drylands_8857.shp
  raster_crs: EPSG:8857
  hex_area_km2: 100
  orientation: flat
  output_prefix: outputs/vegetation/msavi/MSAVI_014_trend_hex_100
  n_jobs: auto
