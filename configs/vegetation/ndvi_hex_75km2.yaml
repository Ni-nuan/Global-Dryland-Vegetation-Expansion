name: ndvi_hex_75km2
index: NDVI
description: Reusable vegetation-expansion configuration. Scientific logic is implemented
  once in src/01_vegetation_expansion/.
threshold:
  enabled: false
  input_folder: data/local/vegetation/ndvi_annual
  output_folder: data/local/vegetation/ndvi_threshold_020_8857
  tif_pattern: '*.tif'
  threshold: 0.2
  scale_factor: 1.0
  dst_crs: EPSG:8857
  dst_resolution_m: 500
  nodata_out: 255
  overwrite: false
  note: Reuse the NDVI > 0.20 binary rasters generated by ndvi_main.yaml; no second
    threshold pass is required.
hex_trend:
  tif_folder: data/local/vegetation/ndvi_threshold_020_8857
  tif_pattern: '*_measure.tif'
  mask_vector: data/local/drylands/drylands_8857.shp
  raster_crs: EPSG:8857
  hex_area_km2: 75
  orientation: flat
  output_prefix: outputs/vegetation/ndvi_hex_75km2/NDVI_020_trend_hex_75
  n_jobs: auto
